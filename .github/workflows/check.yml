name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install just
        env:
          JUST_VERSION: 1.58.0
        run: |
          curl --fail --silent --show-error --location "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-aarch64-apple-darwin.tar.gz" -o "$RUNNER_TEMP/just.tar.gz"
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: Install the Rust toolchain
        # Reads rust-toolchain.toml: the pinned version, Clippy, rustfmt and the iOS targets.
        run: rustup toolchain install
      - run: xcodebuild -version
      - run: just check
      - run: git diff --exit-code
