[workspace]
resolver = "3"
members = ["crates/setup", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Exact: the wire format the controller speaks is the one this release encodes.
km43 = "=0.6.3"
getrandom = "0.4.3"
thiserror = "2.0.21"
uniffi = "0.32.2"
zeroize = "1.9.0"
hex = "0.4.3"
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every fallible function here returns one of two error enums whose variants
# each document the case; a `# Errors` heading per step would repeat them. The
# same call km43 makes in its manifest.
missing_errors_doc = "allow"
